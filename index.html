<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="stylesheet" href="style.css">
  <title>rock-paper-scissors</title>
</head>
<body>
  <div class="container">
    <h1>rock-paper-scissors<span class="blink">_</span></h1>
    <div class="gestures">
      <div class="human-container">
        <div class="player-title">human</div>
        <pre class="gesture" id="human-gesture"></pre>
        <div class="score" id="human-score">0</div>
      </div>
      <div id="results" class="hidden"></div>
      <div class="computer-container">
        <div class="player-title">computer</div>
        <pre class="gesture" id="computer-gesture"></pre>
        <div class="score" id="computer-score">0</div>
      </div>
    </div>
    <div id="buttons">
      <button id="rock">rock</button>
      <button id="paper">paper</button>
      <button id="scissors">scissors</button>
    </div>
  </div>

  <script src="frames.js"></script>
  <script src="script.js"></script>
</body>
</html>
